# 이 파일을 복사해 config.yaml 을 만들고 값을 채우세요. (config.yaml 은 git에 올라가지 않습니다)

notion:
  data_source_id: "노션-데이터-소스-ID"   # 데이터베이스 안의 표(collection) ID
  api_version: "2025-09-03"
  properties:            # 노션 표의 칸 이름
    title: "할 일"
    assignee: "담당자"
    date: "날짜"
    part: "파트"
    epic: "에픽"
    sp: "SP"
    priority: "우선순위"
    jira_key: "Jira 키"

jira:
  base_url: "https://your-site.atlassian.net"
  project_key: "PROJ"
  issue_type: "Task"                  # 한국어 Jira면 "작업"
  story_points_field: "customfield_10000"
  default_priority: "Medium"
  epics:                              # 노션 에픽 선택지의 첫 단어 → Jira 에픽 키
    "F-01": "PROJ-1"
    "공통": "PROJ-2"
  sprint:
    enabled: true
    board_id: null                    # 비워 두면 프로젝트의 보드를 자동으로 찾음

rules:
  allowed_sp: [1, 2, 3, 5]
  weekly_sp_min: 25
  weekly_sp_max: 30

# 담당자 -> Jira accountId 표.
# 노션 '담당자'가 선택 속성(이름)이면 팀원 이름을 모두 적어야 해요. 공용 Jira에는 같은 이름의
# 다른 계정이 있을 수 있어서, 이름으로 검색하지 않고 이 표만 씁니다.
# 사람 속성(이메일)을 쓸 때는 이메일로 못 찾는 경우에만 "이메일": "accountId"로 적으면 돼요.
# accountId는 Jira에서 그 사람 프로필 주소(/people/<accountId>)나 이슈 담당자 정보에서 확인할 수 있어요.
members:
  "홍길동": "712020:00000000-0000-0000-0000-000000000000"
